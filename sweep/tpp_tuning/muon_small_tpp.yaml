program: main.py
method: grid
name: muon_small_tpp

metric: {name: eval_loss, goal: minimize}

command:
  - ${env}
  - python
  - main.py
  - -cn
  - llama_fineweb
  - wandb_mode=online
  - wandb_tag=llama_fineweb_v3
  - wandb_project=llama_proj
  - opt.clip=1
  - ${args_no_hyphens}

parameters:
  "ckpt":
    values: [true]

  "model.base_D":
    values: [512]
  "model.D":
    values: [384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024]

  "opt.lr":
    values: [0.008] #  0.004, 0.016
  "opt.weight_decay":
    values: [0.00032] # , 0.00016, 0.00064

  "opt.embed_lr_mult":
    values: [1.6] 

  "opt.warmup_tokens":
    values: [0.003]


  "total_flops":
    values: [4320355351737139200]
    # Flop per token: 387,793,920 
    # Num params: 185,680,896
    # Tokens: 3,713,617,920
    # Total Flops: flop per token * 3 * tokens = 4320355351737139200

  # "token_per_param":
  #   values: [20]

  "opt.name":
    values: [muon_adam]
    

  "opt.mup":
    values: [true]
  "opt.depth_mup":
    values: [true]
  "opt.scale_eps":
    values: [true]

  "opt.b1":
    values: [0.95]
  "opt.eps":
    values: [1e-5]
  
  "opt.adam_b1":
    values: [0.8]
  "opt.adam_b2":
    values: [0.98]
  "opt.adam_eps":
    values: [1e-15]

