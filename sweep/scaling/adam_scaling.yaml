program: main.py
method: grid
name: adam_scaling

metric: {name: eval_loss, goal: minimize}

command:
  - ${env}
  - python
  - main.py
  - -cn
  - llama_fineweb
  - wandb_mode=online
  - wandb_tag=llama_fineweb_v3
  - wandb_project=llama_proj
  - opt.clip=1
  - ${args_no_hyphens}

parameters:
  "ckpt":
    values: [true]
    
  "model.base_D":
    values: [512]
  "model.D":
    values: [512, 768, 1024, 1536]
  "custom_ablation_str":
    values: ["None", "double_lr", "half_lr", "double_wd", "half_wd", "fix_warmup_ratio"]


  "opt.lr":
    values: [0.004]
  "opt.b2":
    values: [0.98]

  "opt.warmup_tokens":
    values: [742723584]
  "opt.wdxD":
    values: [0.1024] # 0.0002

  "opt.mup":
    values: [True]
  "opt.depth_mup":
    values: [True]
  "opt.scale_eps":
    values: [True]

  "opt.name":
    values: [adam]

  "token_per_param":
    values: [20]


  "opt.b1":
    values: [0.9]

  "opt.eps":
    values: [1e-20]


  

